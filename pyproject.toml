[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[project]
dependencies = [
  "click>=8.3.1,<8.5.0",
  "rdflib>=7.1.3,<7.7.0",
  "requests>=2.32.3,<2.35.0",
  "molgenis-emx2-pyclient>=11.57.0",
  "unidecode~=1.4.0",
  "python-dotenv~=1.2.1",
  "pyyaml~=6.0.3"
]
name = "molgenis-fdp-harvester"
version = "0.1.0"
description = 'This project contains a FAIR Data Point harvester for MOLGENIS.'
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
keywords = []
authors = [
  { name = "Mark Janse", email = "mark.janse@health-ri.nl" },
  { name = "Alexander Harms", email = "alexander.harms@health-ri.nl" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Documentation = "https://github.com/health-ri/molgenis-fdp-harvester#readme"
Issues = "https://github.com/health-ri/molgenis-fdp-harvester/issues"
Source = "https://github.com/health-ri/molgenis-fdp-harvester"

[project.scripts]
harvest = "molgenis_fdp_harvester.harvester:cli"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "types" },
  { include-group = "lint" },
]
test = [
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-click",
  "pytest-cov",
  "pytest-mock",
  "requests-mock",
]
types = ["mypy>=1.0.0"]
lint = ["ruff>=0.8.0"]

[tool.pytest.ini_options]
norecursedirs = ["dev"]

[tool.coverage.run]
source_pkgs = ["molgenis_fdp_harvester", "tests"]
branch = true
parallel = true
omit = ["tests/*"]

[tool.coverage.paths]
molgenis_fdp_harvester = [
  "src/molgenis_fdp_harvester",
]
tests = ["tests", "*/molgenis-fdp-harvester/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "PTH", # flake8-use-pathlib
  "ARG", # flake8-unused-arguments
  "S",   # flake8-bandit
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "ERA", # eradicate
  "T20", # flake8-print
  "TID", # flake8-tidy-imports
  "DTZ", # flake8-datetimez
  "PERF", # Perflint
  "PL",  # Pylint
  "G",   # flake8-logging-format
  "SLF", # flake8-self
  "RUF", # Ruff-specific rules
]
ignore = ["SLF001", "G004", "PLR2004", "ERA001", "SIM117", "S105", "PT012"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", # assert is the standard way to check expectations in pytest
]

[tool.ruff.lint.isort]
known-first-party = ["molgenis_fdp_harvester"]

# Like Black, use double quotes for strings, indent with spaces, and
# respect magic trailing commas.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
