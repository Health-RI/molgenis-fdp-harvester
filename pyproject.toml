[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
dependencies = [
  "click~=8.3.1",
  "rdflib~=7.1.3",
  "python-dateutil~=2.9.0.post0",
  "pandas~=2.3.3",
  "geomet~=1.1.0",
  "requests~=2.32.3",
  "molgenis-emx2-pyclient>=11.57.0",
  "unidecode~=1.4.0",
  "python-dotenv~=1.2.1",
  "yarl~=1.22.0"
]
name = "molgenis-fdp-harvester"
dynamic = ["version"]
description = 'This project contains a FAIR Data Point harvester for MOLGENIS.'
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
  { name = "Mark Janse", email = "mark.janse@health-ri.nl" },
  { name = "Alexander Harms", email = "alexander.harms@health-ri.nl" }
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Documentation = "https://github.com/health-ri/molgenis-fdp-harvester#readme"
Issues = "https://github.com/health-ri/molgenis-fdp-harvester/issues"
Source = "https://github.com/health-ri/molgenis-fdp-harvester"

[project.scripts]
harvest = "molgenis_fdp_harvester.harvester:cli"

[dependency-groups]
dev = [
  "pytest",
  "pytest-mock",
  "requests-mock",
  "pytest-cov",
  "pytest-click",
]

[tool.hatch.version]
path = "src/molgenis_fdp_harvester/__about__.py"

[tool.coverage.run]
source_pkgs = ["molgenis_fdp_harvester", "tests"]
branch = true
parallel = true
omit = ["src/molgenis_fdp_harvester/__about__.py", "tests/*"]

[tool.coverage.paths]
molgenis_fdp_harvester = [
  "src/molgenis_fdp_harvester",
]
tests = ["tests", "*/molgenis-fdp-harvester/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
