name: Run linting and type checking for Python

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint
        run: ruff check . --ignore SLF001,G004,PLR2004,ERA001,ARG002,ARG001,SIM117,S105,PT012

      # For later:
      # - name: Type check
      #   run: mypy src